<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">Where code belongs: core, connectors and domain packs</title>
<desc id="desc">Three layers. Domain packs hold product-specific tools and build on algen-agent-tools, which holds generic connectors such as Gmail, IMAP, Postgres and documents, and builds on algen-agent-runtime, the core that owns contracts, approvals, policies and audit.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1440" y2="830" gradientUnits="userSpaceOnUse"><stop stop-color="#0C0C0B"/><stop offset="1" stop-color="#2A2418"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1440" y2="830" gradientUnits="userSpaceOnUse"><stop stop-color="#F3D98B"/><stop offset=".5" stop-color="#D4A017"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#E9C86D" stroke-opacity=".06"/></pattern>
<filter id="lift" x="-5%" y="-20%" width="110%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2A2418" flood-opacity=".12"/></filter>
</defs>
<rect width="1440" height="830" rx="28" fill="url(#bg)"/>
<rect width="1440" height="830" rx="28" fill="url(#grid)"/>
<text x="72" y="84" fill="#F5F0E8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="36" font-weight="780" letter-spacing="-1">Where code belongs</text>
<text x="72" y="118" fill="#C9C2B4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="19">Each layer builds only on the public API of the layer below it.</text>
