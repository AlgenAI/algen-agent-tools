<text x="112" y="234" fill="#F5F0E8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="700">your-product-pack</text>
<text x="112" y="268" fill="#C9C2B4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17">Product-specific tools and decisions.</text>
