name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0a1). The tag must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_dispatch use the provided tag; on release event use the release ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches package version
        run: |
          version=$(python -c 'import pathlib, re; text = pathlib.Path("src/algen_agent_tools/__init__.py").read_text(); print(re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE).group(1))')
          ref_name="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "v${version}" = "${ref_name}"
      - run: python -m pip install -e '.[dev,all]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src/algen_agent_tools
      - run: pytest -q -p no:cacheprovider
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Generate and verify artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          dist = Path("dist")
          sums = []
          for p in sorted(dist.iterdir()):
              if p.suffix in (".whl", ".gz"):
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  sums.append(f"{digest}  {p.name}\n")
          Path("dist/SHA256SUMS").write_text("".join(sums))
          PY
          cd dist
          sha256sum -c SHA256SUMS
      - name: Inspect release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {"algen_agent_tools/py.typed", "algen_agent_tools/testing.py"}
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel missing required files: {sorted(missing)}")
              if any("__pycache__" in name or name.endswith(".pyc") for name in names):
                  raise SystemExit("wheel contains Python cache files")
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              for required in ("LICENSE", "NOTICE", "README.md"):
                  if not any(name.endswith(f"/{required}") for name in names):
                      raise SystemExit(f"sdist missing {required}")
          PY
      - name: Install the wheel and describe its plugins outside the checkout
        run: |
          python -m venv /tmp/algen-tools-release-smoke
          /tmp/algen-tools-release-smoke/bin/pip install --upgrade pip
          /tmp/algen-tools-release-smoke/bin/pip install --pre dist/*.whl
          /tmp/algen-tools-release-smoke/bin/python scripts/smoke_describe.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Remove non-distribution assets before PyPI publish
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

