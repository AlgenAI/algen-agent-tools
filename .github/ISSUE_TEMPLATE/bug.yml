name: Bug report
description: Report a reproducible defect without including secrets or private data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Versions (algen-agent-tools and algen-agent-runtime)
      placeholder: algen-agent-tools 0.2.0a2 with algen-agent-runtime 0.1.0a13
    validations:
      required: true
  - type: input
    id: connector
    attributes:
      label: Connector
      placeholder: postgres, smtp, gmail, mcp, ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Linux, macOS, Container, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, prompts, customer data, and private endpoints.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
