[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "algen-agent-tools"
dynamic = ["version"]
description = "Curated, governed connectors for Algen Agent Runtime agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AlgenAI"}]
maintainers = [{name = "AlgenAI"}]
keywords = [
  "agents",
  "agent-tools",
  "ai-governance",
  "connectors",
  "llm",
  "mcp",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# The supported Runtime range. CI tests the lowest and the highest release in it.
dependencies = [
  "algen-agent-runtime>=0.1.0a12,<0.2",
]

[project.optional-dependencies]
all = [
  "algen-agent-tools[discord,documents,github,gmail,mcp,outlook,postgres,smtp,telegram]",
]
# Discord uses httpx, already installed with the Runtime.
discord = []
# Gmail uses httpx and SMTP the standard library, both already installed with the Runtime;
# their extras exist so every connector installs the same way.
# PDFs are read by the Runtime's document inspection, which needs PyMuPDF (AGPL-3.0). DOCX, text
# and Markdown need nothing beyond the Runtime.
documents = ["algen-agent-runtime[documents]>=0.1.0a12,<0.2"]
# GitHub is an MCP overlay, so it needs the Runtime's MCP client.
github = ["algen-agent-runtime[mcp]>=0.1.0a12,<0.2"]
gmail = []
# Outlook uses httpx, already installed with the Runtime.
outlook = []
mcp = ["algen-agent-runtime[mcp]>=0.1.0a12,<0.2"]
postgres = ["asyncpg>=0.29,<1"]
smtp = []
# Telegram uses httpx, already installed with the Runtime.
telegram = []
dev = [
  "mypy>=1.11,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.entry-points."algen_agent_runtime.plugins"]
"algen_agent_tools.discord" = "algen_agent_tools.discord.plugin:DiscordPlugin"
"algen_agent_tools.github" = "algen_agent_tools.github.plugin:GithubPlugin"
"algen_agent_tools.gmail" = "algen_agent_tools.gmail.plugin:GmailPlugin"
"algen_agent_tools.outlook" = "algen_agent_tools.outlook.plugin:OutlookPlugin"
"algen_agent_tools.postgres" = "algen_agent_tools.postgres.plugin:PostgresPlugin"
"algen_agent_tools.sample" = "algen_agent_tools.sample.plugin:SamplePlugin"
"algen_agent_tools.smtp" = "algen_agent_tools.smtp.plugin:SmtpPlugin"
"algen_agent_tools.telegram" = "algen_agent_tools.telegram.plugin:TelegramPlugin"

[project.urls]
Homepage = "https://github.com/AlgenAI/algen-agent-tools"
Source = "https://github.com/AlgenAI/algen-agent-tools"
Documentation = "https://github.com/AlgenAI/algen-agent-tools#readme"
Issues = "https://github.com/AlgenAI/algen-agent-tools/issues"
Changelog = "https://github.com/AlgenAI/algen-agent-tools/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/algen_agent_tools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/algen_agent_tools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/algen_agent_tools",
  "/docs",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that call a real external service; run only with ALGEN_TOOLS_LIVE=1",
  "integration: tests that need a local service such as a PostgreSQL container",
]

[tool.coverage.run]
source = ["algen_agent_tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["algen_agent_tools"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "jsonschema", "mcp", "mcp.*", "yaml"]
ignore_missing_imports = true
